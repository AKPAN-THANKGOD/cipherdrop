services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # memory only, nothing written to disk
    restart: unless-stopped
  app:
    build: .
    environment:
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "1"   # the app is only reachable through Caddy, so its forwarded IPs can be trusted
    expose: ["3000"]
    depends_on: [redis]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
